# Builds the installer from the public code, so what people download is provably this repo (SignPath Foundation signs
# only CI builds). A pushed tag (v0.9.9) makes a DRAFT release with the installer: write its notes and publish it by
# hand; the app's update check and the README button skip drafts. "Run workflow" builds it without a release.
# Signing turns on by itself once the SIGNPATH_API_TOKEN secret and the SIGNPATH_ORGANIZATION_ID variable exist.
name: Instalador

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  build:
    runs-on: windows-latest
    env:
      SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Dependencias fuera de git (FFmpeg, SDK de VST3, Basic Pitch)
        shell: pwsh
        run: |
          ./tools/get-ffmpeg.ps1
          ./tools/get-vst3sdk.ps1
          ./tools/get-basic-pitch.ps1

      - name: Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: La versión coincide con el tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $v = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          if ("v$v" -ne $env:GITHUB_REF_NAME) { throw "Directory.Build.props dice $v y el tag es $env:GITHUB_REF_NAME" }

      - name: Comprobar el DSP (wtlab comprobar-dsp)
        shell: pwsh
        run: |
          dotnet build src/WildTrack.Lab -c Release -nologo -v:minimal
          if ($LASTEXITCODE -ne 0) { throw 'wtlab no compiló' }
          & src/WildTrack.Lab/bin/Release/net10.0-windows/wtlab.exe comprobar-dsp
          if ($LASTEXITCODE -ne 0) { throw "wtlab comprobar-dsp falló ($LASTEXITCODE)" }

      - name: Instalador
        shell: pwsh
        run: |
          ./tools/make-installer.ps1
          if (-not (Test-Path artifacts/publish/wtvsthost.exe)) { throw 'Falta wtvsthost.exe: no compiló el puente de VST3' }

      - name: Subir el instalador sin firmar
        id: unsigned
        uses: actions/upload-artifact@v4
        with:
          name: instalador-sin-firmar
          path: artifacts/WildTrack-Setup.exe
          if-no-files-found: error

      - name: Firmar con SignPath
        if: env.SIGNPATH_API_TOKEN != ''
        uses: signpath/github-action-submit-signing-request@v1
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG || 'WildTrack' }}
          signing-policy-slug: ${{ vars.SIGNPATH_POLICY_SLUG || 'release-signing' }}
          github-artifact-id: ${{ steps.unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: artifacts/signed

      - name: Elegir el instalador final
        shell: pwsh
        run: |
          $signed = 'artifacts/signed/WildTrack-Setup.exe'
          $exe = if (Test-Path $signed) { $signed } else { 'artifacts/WildTrack-Setup.exe' }
          New-Item -ItemType Directory -Force artifacts/final | Out-Null
          Copy-Item $exe artifacts/final/
          $sig = Get-AuthenticodeSignature artifacts/final/WildTrack-Setup.exe
          Write-Host "Firma: $($sig.Status) $($sig.SignerCertificate.Subject)"

      - uses: actions/upload-artifact@v4
        with:
          name: instalador
          path: artifacts/final/WildTrack-Setup.exe

      - name: Release en borrador
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $v = $env:GITHUB_REF_NAME.TrimStart('v')
          # a release made by hand for this tag stays as it is; the build is still in the run's artifacts
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) { Write-Host "El release $env:GITHUB_REF_NAME ya existe: no lo toco."; exit 0 }
          gh release create $env:GITHUB_REF_NAME artifacts/final/WildTrack-Setup.exe --draft --verify-tag `
            --title "WildTrack $v" --notes "Borrador armado por GitHub Actions: escribí las notas y publicalo."
          if ($LASTEXITCODE -ne 0) { throw 'No pude crear el release' }
